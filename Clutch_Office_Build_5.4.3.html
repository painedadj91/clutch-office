<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clutch Office – Build 5.4.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E2E4DE;--surface:#F4F5F0;--surface2:#E8EAE3;--ink:#1B2430;--muted:#5A646E;--line:#C8CCC3;
  --t:#B96A0E;--ct:#2D5A97;--win:#2D7547;--loss:#A5382A;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#151A1F;--surface:#1E252C;--surface2:#28313A;--ink:#E6E8E2;--muted:#9AA3AC;--line:#36414C;--t:#E39A42;--ct:#6E9EDD;--win:#62B783;--loss:#E57563;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#151A1F;--surface:#1E252C;--surface2:#28313A;--ink:#E6E8E2;--muted:#9AA3AC;--line:#36414C;--t:#E39A42;--ct:#6E9EDD;--win:#62B783;--loss:#E57563;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ct);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px}
.muted{color:var(--muted)}
h1{font:700 44px/1 var(--cond);margin:0 0 10px}
h2{font:700 30px/1.1 var(--cond);margin:0 0 12px}
h3{font:600 21px/1.2 var(--cond);margin:26px 0 8px}
p{margin:0 0 10px;max-width:70ch}
.hint{color:var(--muted);font-size:15px}
.pos{color:var(--win)} .neg{color:var(--loss)}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font:700 26px/1 var(--cond);display:flex;align-items:center;gap:8px}
.brand .tag{background:var(--ink);color:var(--surface);padding:3px 7px;border-radius:3px;font-size:18px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:15px}
.meta b{color:var(--ink);font-weight:600}
.meta .neg b{color:var(--loss)}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line)}
@media (max-width:760px){nav.tabs{padding:4px 6px;gap:4px}nav.tabs button{padding:7px 10px;font-size:16px;border:1px solid var(--line);border-radius:4px}nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 13px 9px;font:600 18px var(--cond);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ct)}
nav.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t);margin-left:5px;vertical-align:middle}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.btn{font:600 18px/1 var(--cond);padding:11px 18px;border-radius:4px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.sm{font-size:15px;padding:6px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
select{font:500 16px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);color:var(--ink);max-width:100%}

.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:6px 0 4px}
.fixture .tm{font:700 30px/1.05 var(--cond)}
.fixture .tm.r{text-align:right}
.fixture .tm small{display:block;font:500 14px var(--body);color:var(--muted);margin-top:4px}
.fixture .vs{font:600 18px var(--cond);color:var(--muted)}
.comp{font:600 17px var(--cond);color:var(--muted);margin-bottom:4px}

.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.map{text-align:left;padding:10px 12px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.map .nm{font:600 20px/1.1 var(--cond)}
.map small{font-size:13px;color:var(--muted)}
.map[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ct);border-color:var(--ct)}
.map:disabled{cursor:not-allowed;opacity:.5}
.map:disabled .nm{text-decoration:line-through}
div.map{cursor:default}
.bar{height:4px;background:var(--line);border-radius:2px;position:relative;margin:2px 0 4px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ct);border-radius:2px}
.bar.opp i{background:var(--loss)}

.plan{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface2);padding:9px 14px;font:600 17px var(--cond);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.note{border-left:4px solid var(--t);padding:8px 12px;background:var(--surface2);border-radius:0 4px 4px 0;margin:14px 0 0}
.note.bad{border-left-color:var(--loss)}
.order{margin:12px 0 0;padding-left:22px}
.order li{margin:2px 0}

.ev{border:1px solid var(--line);border-left:8px solid var(--t);background:var(--surface);border-radius:6px;padding:18px 20px;margin-bottom:16px}
.ev h2{margin-bottom:8px}

.board{display:grid;grid-template-columns:1fr auto 1fr;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.board .sd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-left:10px solid var(--c)}
.board .sd.b{border-left:0;border-right:10px solid var(--c)}
.sd.ct{--c:var(--ct)} .sd.t{--c:var(--t)}
.board .nm{font:700 24px/1.05 var(--cond)}
.board .nm small{display:block;font:600 14px var(--body);color:var(--c);margin-top:5px}
.board .sd.b .nm{text-align:right}
.board .sc{font:700 68px/1 var(--cond);font-variant-numeric:tabular-nums}
.board .mid{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 14px;color:var(--muted);font-size:13px;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
.board .mid b{font:600 20px var(--cond);color:var(--ink)}
.strip-wrap{overflow-x:auto;margin:10px 0 0;padding-bottom:2px}
.strip{display:grid;gap:3px;grid-template-rows:12px 12px}
.strip i{display:block;border-radius:2px;background:var(--surface);min-width:9px}
.strip i.ct{background:var(--ct)} .strip i.t{background:var(--t)}
.strip i.half{margin-left:7px}
.livegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.radar-wrap{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;max-width:640px;width:100%}
#radar{display:block;width:100%;aspect-ratio:1/1;border-radius:4px;background:#141A20}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);padding:6px 4px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.round{margin:0 0 8px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.round b{font:600 21px var(--cond)}
.round .how{font-weight:600;width:100%}
.hl{display:inline-block;background:var(--ink);color:var(--surface);font:600 15px var(--cond);padding:2px 8px;border-radius:3px;margin-top:4px}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:4px;min-height:40px}
.feed li{display:flex;gap:8px;align-items:baseline;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:3px;animation:in .25s both}
.feed .ct{color:var(--ct);font-weight:600} .feed .t{color:var(--t);font-weight:600}
.feed .x{color:var(--muted);font-size:14px} .feed .v{color:var(--muted)}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
@media (prefers-reduced-motion:reduce){.feed li{animation:none}}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.bigpanel{padding:18px 20px;border-radius:6px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c,var(--ink))}
.bigpanel.w{--c:var(--win)} .bigpanel.l{--c:var(--loss)} .bigpanel.ht{--c:var(--t)}
.bigpanel h2{margin-bottom:6px}
.htgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.htgrid label{display:block;font:600 17px var(--cond);margin:14px 0 6px}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font:600 15px var(--cond);color:var(--muted)}
th.l,td.l{text-align:left}
tr.me td{background:var(--surface2)}
tr.me td.nm{box-shadow:inset 4px 0 0 var(--ct)}
td small{color:var(--muted)}
td.zp{color:var(--win);font-weight:600} td.zr{color:var(--loss);font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--ct);cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pill{display:inline-block;font:600 13px var(--body);padding:1px 7px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-left:4px}
.pill.bad{color:var(--loss);border-color:var(--loss)}

.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.staff .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.staff .card b{font:600 21px var(--cond)}
.pips{display:flex;gap:4px}
.pips i{width:22px;height:6px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ct)}

.bracket{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.bracket h4{font:600 17px var(--cond);margin:0 0 6px;color:var(--muted)}
.bm{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:14px;margin-bottom:6px}
.bm div{display:flex;justify-content:space-between;gap:8px}
.bm .won{font-weight:600} .bm .lost{color:var(--muted)}
.bm.me{box-shadow:inset 3px 0 0 var(--ct)}

.map.ban{opacity:.45}.map.ban .nm{text-decoration:line-through}
.map.mine{box-shadow:inset 0 0 0 2px var(--ct)}.map.theirs{box-shadow:inset 0 0 0 2px var(--loss)}
.map.drawn{box-shadow:inset 0 0 0 3px var(--t);background:var(--surface)}
.vlog{list-style:none;margin:6px 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.vlog li{padding:4px 10px;border-radius:4px;font-size:14px;background:var(--surface2);border-left:4px solid var(--ct)}.vlog li.them{border-left-color:var(--loss)}
.drawbox{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-left:8px solid var(--t);border-radius:6px;background:var(--surface)}
.drawbox small{display:block;color:var(--muted);font-size:13px}.drawbox>b{font:700 34px/1.1 var(--cond)}
.rbox{position:relative}
.rfeed{margin:0;padding:6px 8px;list-style:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px;height:104px;overflow:hidden;background:#10161C;border-radius:0 0 4px 4px;border-top:1px solid #222B33}
.rfeed li{background:rgba(12,16,20,.82);color:#E6E8E2;font:500 12px/1.35 var(--body);padding:2px 7px;border-radius:3px;display:flex;gap:6px;align-items:baseline;white-space:nowrap;animation:in .25s both}
.rfeed li.mine{box-shadow:inset 0 0 0 1px rgba(230,232,226,.7)}
.rfeed .ct{color:#6FB0F5;font-weight:600}.rfeed .t{color:#F2AA4C;font-weight:600}.rfeed .x{color:#9AA3AC;font-size:11px}
.paused{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(12,16,20,.85);color:#E6E8E2;font:600 15px var(--cond);padding:5px 12px;border-radius:4px;pointer-events:none}
.ctrls{margin-top:8px;gap:6px}
#radar{cursor:pointer;border-radius:0}
.rfeed li.mine{box-shadow:inset 3px 0 0 #E6E8E2}
button.pill{cursor:pointer;font:600 13px var(--body);background:var(--surface2)}
.tipsheet{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:flex-start;z-index:20}
.tipsheet p{margin:6px 0 0;font-size:15px}.tipsheet>div{flex:1}
.guns{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;gap:8px;align-items:center}
.gname{flex:1;min-width:0;font:700 22px var(--cond);border:1px solid transparent;background:transparent;color:var(--ink);padding:2px 4px;border-radius:4px}
.gname:hover,.gname:focus{border-color:var(--line);background:var(--surface2)}
.gstats,.gbars{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}
.bal{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.balrow{display:grid;grid-template-columns:80px auto 52px auto;gap:8px;align-items:center;font-size:14px}.balrow b{text-align:center;font-variant-numeric:tabular-nums}
.gi{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}.gi p{margin:0;font-size:15px}.gi .pill{flex:none}
td.wrap{white-space:normal}
.pill.good{color:var(--win);border-color:var(--win)}
.tr{margin-top:2px;white-space:normal}.tr .pill{margin:2px 4px 0 0}
.tlist p{margin:4px 0;font-size:14px}
.house{max-width:880px;margin:8px 0 10px}
.roof{height:22px;background:var(--ink);clip-path:polygon(4% 100%,50% 0,96% 100%);margin:0 6px}
.floor{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--ink);border:4px solid var(--ink);border-radius:0 0 6px 6px}
.room{background:var(--surface);padding:6px 7px 8px;min-height:92px;display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative;transition:background .12s}
.room::after{content:"";position:absolute;bottom:-3px;left:38%;width:24%;height:3px;background:var(--surface)}
.room.r-rest{background:var(--surface2)}
.room .rh{display:flex;justify-content:space-between;align-items:baseline;font:600 15px/1.1 var(--cond)}.room .rh small{color:var(--muted);font:500 12px var(--body)}
.room.full .rh small{color:var(--loss)}
.room.fitsel{box-shadow:inset 0 0 0 2px var(--win)}
.room.over{background:var(--surface2);box-shadow:inset 0 0 0 3px var(--ct)}
.room.full.over{box-shadow:inset 0 0 0 3px var(--loss)}
.rb{display:flex;flex-wrap:wrap;gap:4px}
.tok{position:relative;display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--ct);border-radius:4px;padding:3px 7px 5px;font:600 13px var(--body);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:hidden;max-width:100%}
.tok span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-rest .tok{background:var(--surface);border-left-color:var(--muted)}
.tok.hot{border-left-color:var(--t)}
.tok.maxed{opacity:.6}
.tok.sel{outline:2px solid var(--ct);outline-offset:1px}
.tok.lifted{opacity:.3}
.tok.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.3);cursor:grabbing}
.tok .tb{position:absolute;left:0;bottom:0;height:2px;background:var(--ct)}
.tok .fd{width:7px;height:7px;border-radius:50%;background:var(--win);flex:none}
.pdet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:grid;gap:3px;font-size:14px;min-height:62px;align-content:center}
.mprow{gap:8px;margin:6px 0}.mprow b{font:600 16px var(--cond)}
@media (max-width:760px){.floor{grid-template-columns:repeat(2,1fr)}.room{min-height:74px}}
.alivebar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#10161C;padding:5px 8px;border-radius:4px 4px 0 0;border-bottom:1px solid #222B33}
.ab{display:flex;align-items:center;gap:3px;color:#E6E8E2}.ab b{font:700 14px var(--cond);margin:0 4px}.ab em{font:700 16px var(--cond);font-style:normal;margin:0 4px}
.ab .pl{display:inline-block;width:11px;height:11px;border-radius:50%;background:#9AA3AC}.ab .pl.t{background:#F0A13A}.ab .pl.ct{background:#5EA3F0}
.ab .sk{width:13px;height:13px;fill:#6B7680}
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.camp{background:var(--surface);border:2px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-height:120px;cursor:pointer;transition:border-color .15s,background .15s}
.camp .ch{display:flex;justify-content:space-between;align-items:baseline}.camp .ch b{font:700 21px var(--cond)}
.camp.rest{border-style:solid;background:var(--surface2)}
.camp.fitsel{border-color:var(--win)}
.camp.over{border-color:var(--ct);border-style:solid;background:var(--surface2)}
.camp.full.over{border-color:var(--loss)}
.cbody{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0}
.pchip{background:var(--surface2);border:1px solid var(--line);border-left:5px solid var(--ct);border-radius:6px;padding:8px 10px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:grid;gap:4px}
.camp.rest .pchip{background:var(--surface);border-left-color:var(--muted)}
.pchip.hot{border-left-color:var(--t)}
.pchip.sel{outline:2px solid var(--ct);outline-offset:1px}
.pchip.lifted{opacity:.35}
.pchip.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:rotate(-2deg);cursor:grabbing}
.pc1{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.pc1 b{font-size:15px}.pc1 small{color:var(--muted)}
.fit{font:600 12px var(--body);color:var(--win)}
.pc2{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14px}
.mini{flex:1;max-width:110px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ct)}
.hotbtn{justify-self:start;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;padding:2px 10px;font:600 12px var(--body);cursor:pointer}
.hotbtn[aria-pressed="true"]{background:var(--t);border-color:var(--t);color:#1B1206}
.subtabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}.subtabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;padding:7px 12px;font:600 16px var(--cond);cursor:pointer}.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pt{display:block;border-radius:50%;flex:none}
.pcell{display:flex;gap:8px;align-items:center}.pbtn,.plink{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:inherit}.plink:hover b{text-decoration:underline}
.stars{color:var(--t);letter-spacing:1px;white-space:nowrap}.stars i{color:var(--line);font-style:normal}
.srole{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.srh{display:flex;justify-content:space-between;align-items:center;gap:10px}

    if(role==="Support"){s.smoke+=5;s.flash+=4;s.gas+=3}

    if((plan||"").startsWith("Stack")){s.smoke+=5;s.gas+=5;s.he+=3}
    if(role==="Anchor"){s.smoke+=6;s.gas+=5;s.he+=4}
    if(role==="Rotator"){s.flash+=5;s.smoke+=3}
    if(role==="Support"){s.smoke+=4;s.flash+=5;s.gas+=3}
    if(role==="AWPer"){s.smoke+=4;s.flash+=3}

function signSponsor(id){const all=activeSponsors(),capacity=ensureUnlocks().unlocks.titles3?2:1;if(all.length>=capacity)return;const sp=(S.sponsors.offers||[]).find(x=>x.id===id);if(!sp||all.some(x=>x.id===id))return;if(!S.sponsors.active)S.sponsors.active={...sp};else S.sponsors.secondary={...sp};addNews(`${human().name} sign a season deal with ${sp.name}.`,true);ui.msg=`${sp.name} signed: ${money(sp.weekly)} per matchday.`;save()}

function makeSeasonObjectives(){const d=humanDiv(),bal=Math.max(50000,Math.round(S.budget*.9/5000)*5000);return[
  {id:`o${S.season}-league`,type:d>1?"promotion":"top4",label:d>1?`Win promotion to ${divisionName(d-1)}`:"Finish in the top 4",reward:3},
  {id:`o${S.season}-finance`,type:"balance",target:bal,label:`Finish the season with at least ${money(bal)}`,reward:2},
  {id:`o${S.season}-youth`,type:"youth",target:8,label:"Give players aged 21 or under at least 8 combined maps",reward:2}
]}
function youthMaps(){return human().roster.map(P).filter(p=>p.age<=21).reduce((a,p)=>a+(p.seas.m||0),0)}
function objectiveLive(o){if(o.type==="promotion")return{v:position("t0")<=4?1:0,max:1,text:position("t0")<=4?"Currently in playoff places":"Outside playoff places"};if(o.type==="top4")return{v:position("t0")<=4?1:0,max:1,text:`Currently ${ord(position("t0"))}`};if(o.type==="balance")return{v:Math.min(S.budget,o.target),max:o.target,text:`${money(S.budget)} / ${money(o.target)}`};const y=youthMaps();return{v:Math.min(y,o.target),max:o.target,text:`${y} / ${o.target} maps`}}
function objectiveMet(o,ctx){if(o.type==="promotion")return ctx.move==="promoted";if(o.type==="top4")return ctx.pos<=4;if(o.type==="balance")return S.budget>=o.target;if(o.type==="youth")return youthMaps()>=o.target;return false}
function ensureBuild3(){S.scouting=S.scouting||{assignment:null,reports:{},searchResults:[],searchMeta:null};S.teamIntel=S.teamIntel||{};S.sponsors=S.sponsors||{season:S.season,active:null,offers:[]};S.objectives=S.objectives||[];if(S.sponsors.season!==S.season||(!S.sponsors.active&&!S.sponsors.offers.length))generateSponsorOffers();if(!S.objectives.length)S.objectives=makeSeasonObjectives()}

function seedProCareerRosters(){
 // Called only by newGame, before world/history creation. Never called by load or migration.
 const cursor=PRO_CAREER_POOLS.map(()=>0);
 for(let d=1;d<=4;d++)for(let club=0;club<8;club++){
  const t=team(S.div[d][club]);
  // Four scenes per club, plus a rotating fifth slot: ten names per scene in each tier.
  const scenes=[0,1,2,3,club%4];
  t.roster.slice(0,5).forEach((id,i)=>{
   const pool=PRO_CAREER_POOLS[scenes[i]],identity=pool.players[cursor[scenes[i]]++],p=P(id);
   const [alias,first,last,nat]=identity;
   Object.assign(p,{handle:alias,first,last,nat,gender:'m',proOrigin:{game:pool.game,alias}});
  });
 }
 S.rosterEdition='mixed-era-pros-5.3';
}

/* ---------- Training camps and potential ---------- */
const STATK=["aim","reaction","util","awareness","movement","confidence","focus","teamwork","composure"];

function genPot(p){

}
const potOvr=p=>ovr({...p,...p.pot,role:p.role});
const potSeen=(p,k)=>p.potSeen&&p.potSeen[k]||null;
const allPotSeen=p=>STATK.every(k=>!!potSeen(p,k));
function scoutAnalysisState(){
  const sc=staffOf("scout");if(!sc)return null;
  let q=S.scoutAnalyses;if(!q||q.season!==S.season||q.step!==S.step)q=S.scoutAnalyses={season:S.season,step:S.step,used:0,paid:0};
  q.cap=stars(sc.sk.potential);return q;
}
function scoutAnalysisCost(){const q=scoutAnalysisState();if(!q)return null;return q.used<q.cap?0:2500+q.paid*1000}
function scoutAnalysisLeft(){const q=scoutAnalysisState();return q?Math.max(0,q.cap-q.used):0}
function scoutAnalysisStatus(){
  const sc=staffOf("scout");if(!sc)return"No scout hired.";const q=scoutAnalysisState(),left=scoutAnalysisLeft(),cost=scoutAnalysisCost();
  return `${ensureManager().analysisCredits} manager reward credits · ${left} of ${q.cap} free potential ${q.cap===1?"analysis":"analyses"} remaining this week${left?"":`. Extra analysis currently costs ${money(cost)}.`}`;
}
function useScoutAnalysis(){
  const q=scoutAnalysisState();if(!q){ui.msg="Hire a scout before analysing potential.";return false}
  const cost=scoutAnalysisCost();if(cost>0&&ensureManager().analysisCredits>0){ensureManager().analysisCredits--;q.used++;ui.msg='Manager reward: one scout-analysis credit used. Scout quality still determines the report.';save();return true}if(cost>0){if(S.budget<cost){ui.msg=`You have used this week's free scout analyses. The next extra analysis costs ${money(cost)}, which you cannot afford.`;return false}addMoney("scouting",-cost);q.paid++;ui.msg=`Extra scout analysis purchased for ${money(cost)}.`}
  q.used++;return true;
}
function analysisBtnText(){const c=scoutAnalysisCost();if(c>0&&ensureManager().analysisCredits>0)return 'Analyse · reward credit';return c==null?"Analyse":c?`Analyse · ${money(c)}`:"Analyse"}
function analysePotential(p,k){
  const sc=staffOf("scout");if(!p||!sc)return false;p.potSeen=p.potSeen||{};
  const keys=k?[k]:STATK,skill=sc.sk.potential,acc=sc.sk.accuracy;
  keys.forEach(x=>{
    const width=skill>=90?0:skill>=75?2:skill>=55?4:skill>=35?7:10;
    const noise=Math.max(0,Math.round((100-acc)/22));
    const h=seeded(`${p.id}|${x}|${sc.id}|potential`)(),centre=clamp(Math.round(p.pot[x]+(h-.5)*2*noise),p[x],99);
    p.potSeen[x]={lo:Math.max(p[x],centre-width),hi:Math.min(99,centre+width),q:skill};
  });return true;
}
function potLabel(p,k){
  if(k){const q=potSeen(p,k);if(!q)return'<span class="muted">?</span>';const lo=Math.max(p[k],q.lo),hi=Math.max(lo,q.hi);if(lo===hi)return`<b>~${lo}</b>`;return`${lo}-${hi}`}
  if(!allPotSeen(p))return'<span class="muted">?</span>';
  const lo=STATK.reduce((a,x)=>a+potSeen(p,x).lo,0),hi=STATK.reduce((a,x)=>a+potSeen(p,x).hi,0);
  return lo===hi?`<b>~${lo}</b>`:`${lo}-${hi}`;
}
function potCell(p,k){

  human().roster.forEach(id=>{const p=P(id);if(p.camp&&CAMPS.hasOwnProperty(p.camp))return;p.camp="Rest";const f=(ROLE_FIT[p.role]||[]).find(c=>campCount(c)<campCap());p.camp=f||"Rest"});

  </tbody></table></div>
  <h3>Training, match experience and potential</h3><p>Every player has a hidden ceiling for each stat. Training and matches both move players toward it, but match experience is important: training is less effective for players who have barely competed, and repeated match evidence gradually lets your staff estimate more of a player's ceiling. Scouts can analyse transfer targets directly; the true ceiling always remains hidden.</p><h3>Condition and practice</h3><p>Fatigue carries between matches. Tired players perform worse, and repeatedly playing exhausted players raises illness and injury risk. Durability controls how well each player handles workload and recovers. Practice matches do not advance the week, pay about 40% of normal match revenue, and can be played repeatedly if you are willing to manage the consequences.</p>
  <h3>Staff</h3><p>Analyst, coach, scout, financial advisor and medic. You see their star ratings when you hire them. Ratings go up over time while they are younger, and rival teams may try to poach your best people.</p>
  <h3>Scouting and transfers</h3><p>Your scout can take one deep assignment at a time: opponent dossiers, deep player reports, player searches or prospect searches. The scout remains committed until the next official matchday. You can approach free agents and players at other clubs. Club players need a fee agreed with their club first, then personal terms: wage, signing bonus and contract length. Free agents cost no fee but want a bigger bonus. Players weigh your reputation, your division, how good your squad is, whether they would start, the money, and their own ambition. Some will not talk to you at all. Rival clubs can bid for the same player. Other clubs bid for your players too, more often when you list them.</p>
  <h3>Smokes</h3><p>Smokes act like a wall. Players will not walk into a smoke unless the call says go and their IQ is 55 or more, or they are Reckless. Anyone pushing out of a smoke is half-blind for about a second, and easy to spot. Players with 68 IQ or more can spray through a smoke at someone they know is there, at a big accuracy penalty.</p>
  <h3>Utility buying and use</h3><p>Every player can buy every standard grenade. Utility skill affects throw accuracy and effectiveness, while role, side, chosen plan, economy and available money decide what the AI prioritises buying. Executes favour smokes and flashes, rushes favour flashes and HEs, anchors favour stall utility, and retakes favour flashes and smokes. Gas is used to flush defenders off cover. A gas mask cuts gas damage by 80% but replaces the helmet, so headshots hurt more.</p>
  <h3>Whitecode equipment</h3><p><b>Bandages.</b> Supports often carry two instead of a grenade. +25 HP each, teammates only, takes two seconds and stops if he takes damage. <b>Stim.</b> Entries often carry one: up to 50 temporary HP for five seconds and 15% faster. <b>Decoy.</b> One per team. Attackers throw it at the other site before an execute to fake a hit and drag rotations. A defending IGL with 75+ IQ sees through it half the time. <b>Helmet.</b> Headshots do 15% less. Pistol headshots no longer one-shot.</p>
  <h3>Economy and the weapon market</h3><p>Every player has a personal weapon market each half: repeated purchases inflate that weapon price (rifles/snipers 5%, SMGs/shotguns 2.5%, pistols 1%) and stock can run out. Side-native rifles cost more for the opposite side. Players who survive keep their gun. Revenge kills earn 2 Bounty Tokens: 2 tokens give 10% off, 5 tokens give 25% off, 10 tokens buy past empty stock at base price.</p>
  <h3>Match rules</h3><p>1:45 rounds, 4-second plant, 45-second fuse, 8-second defuse or 5 with a kit. First to 13. At 12-12, overtime is best of three rounds with sides switching every round.</p>
  <h3>Plans</h3>${TPLANS.concat(CTPLANS).map(k=>`<p><b>${k}.</b> ${PLAN_TXT[k]}</p>`).join("")}
  <h3>Staff</h3><p class="hint">Staff effects are hidden on purpose. Better staff means better results over time.</p>`;
}

  ${(v.phase==='half'||v.phase==='timeout')?'':panel}${replayBar}

function findView(){

  if(f.src==="fa")rows=rows.filter(p=>!p.teamId);else if(/^d[1-7]$/.test(f.src))rows=rows.filter(p=>p.teamId&&divOf(p.teamId)===+f.src[1]);else if(f.src==="listed")rows=rows.filter(p=>p.teamId&&p.listed);
  if(f.role!=="all")rows=rows.filter(p=>p.role===f.role);
  rows=rows.map(p=>({p,fee:askFee(p),it:interest(p),e:est(p),potential:marketPotentialEstimate(p)}));
  const text=String(f.search||'').trim().toLowerCase(),number=k=>f[k]!==''&&f[k]!=null&&Number.isFinite(Number(f[k]))?Number(f[k]):null;
  if(text)rows=rows.filter(r=>[r.p.handle,fullName(r.p),r.p.teamId?team(r.p.teamId).name:'Free agent'].join(' ').toLowerCase().includes(text));
  for(const [key,read,min] of [['minAge',r=>r.p.age,true],['maxAge',r=>r.p.age,false],['maxFee',r=>r.fee,false],['maxWage',r=>r.p.salary,false],['minAbility',r=>r.e,true],['minPotential',r=>r.potential,true]]){const v=number(key);if(v!==null)rows=rows.filter(r=>read(r)!==null&&(min?read(r)>=v:read(r)<=v));}
  if(f.availability==='ready')rows=rows.filter(r=>!r.p.out&&!r.p.refusing);
  if(f.interested==='yes')rows=rows.filter(r=>r.it.s>=34&&!(r.p.noTalk&&r.p.noTalk>absStep()));
  if(f.intel==='assessed')rows=rows.filter(r=>r.potential!==null);else if(f.intel==='full')rows=rows.filter(r=>STATK.every(k=>potSeen(r.p,k)));

  const n=rows.length,page=f.page=clamp(Number(f.page)||0,0,Math.max(0,Math.ceil(n/4)-1)),shown=rows.slice(page*4,page*4+4),full=H.roster.length>=squadCapacity();
  const btn=r=>{const t=talkFor(r.p.id),no=r.it.s<34||(r.p.noTalk&&r.p.noTalk>absStep());return`<button class="btn sm ${t?"primary":""}" data-act="approach" data-id="${r.p.id}" ${!t&&no?"disabled":""}>${t?"Open talks":"Approach"}</button>`};
  const stat=(l,v)=>`<div class="mstat"><small>${l}</small><b>${v}</b></div>`;
  const card=r=>{const p=r.p,sr=scoutRead(p),c=p.teamId?team(p.teamId):null,ratings=f.view==="ratings";
    const stats=ratings?STATK.map(k=>stat(SKN[k],estTxt(p,k)+`<small class="muted" style="display:block">Potential ${potLabel(p,k)}</small>`)):[stat("Estimated ability",(amp<1.2?"":"~")+Math.round(r.e)),stat("Assessed potential",r.potential===null?"Unknown":"~"+r.potential)];
    return`<div class="mcard ${ratings?"ratings":"compact"}"><div class="mhead">${pPort(p,46)}<div class="mwho"><button class="plink" data-act="profile" data-id="${p.id}"><b>${esc(p.handle)}</b></button><small>${p.role} · Age ${p.age} · ${countryFlag(p.nat)} ${p.nat}</small></div></div>
    <div class="mmeta"><span>Club <b>${c?esc(c.name):"Free agent"}</b>${c?` · ${divisionName(divOf(c.id))}`:""}</span><span>Fee <b>${c?money(r.fee):"Free"}</b></span><span>Wage <b>${money(p.salary)}</b></span><span>Contract <b>${c?p.years+" yr":"-"}</b></span></div>
    <div class="mstats">${stats.join("")}</div><details data-playbook-section="market-intel:${p.id}"><summary>Scout detail${p.listed&&p.teamId?" · Listed":""}</summary>${potentialIntelSummary(p)}<div class="sw">Strong: ${sr.str.join(", ")}. Weak: ${sr.weak||"unknown"}.</div></details>
    <div class="mfoot"><div class="${r.it.cls}"><b>${r.it.label}</b>${ratings?`<small class="muted"> · Potential ${potCell(p)}</small>`:""}<small class="muted" style="display:block">${marketWatchers(p).length?`${marketWatchers(p).length} rival club${marketWatchers(p).length>1?"s":""} watching`:"Low outside interest"}</small></div><div class="row"><button class="btn sm" data-act="${scoutReportFor(p)?"openscoutreport":"scoutassign"}" data-type="player" data-id="${p.id}" ${!staffOf("scout")||(!scoutReportFor(p)&&scoutBusy())?"disabled":""}>${scoutReportFor(p)?"Open report":"Full scout report"}</button>${btn(r)}</div></div></div>`};
  const seg=(k,list)=>`<div class="seg">${list.map(([v,l])=>`<button data-act="mkf" data-k="${k}" data-v="${v}" aria-pressed="${f[k]===v}">${l}</button>`).join("")}</div>`;
  return`<p class="hint">Balance ${money(S.budget)}. ${full?"Your squad is full. Sell or release someone before you can sign.":`Room for ${squadCapacity()-H.roster.length} more.`} Affordable reserves four matchdays of current wages alongside the asking fee. Final contract demands may differ.</p>
  <details data-playbook-section="market-scout"><summary>How reliable are these ratings?</summary><p class="hint">${sc?`Estimates by ${esc(fullName(sc))}. ${esc(scoutAnalysisStatus())}`:'No scout: ability is a rough estimate. Potential filters use public reports only.'} Potential filters include assessed skills only; unknown ceilings stay hidden.</p></details>
  ${marketFiltersHtml(f)}
  <div class="market-grid">${shown.map(card).join("")}</div>
  <div class="row page-controls"><button class="btn sm" data-act="marketpage" data-v="${page-1}" ${page<=0?'disabled':''}>Previous</button><small>Showing ${n? page*4+1:0}–${page*4+shown.length} of ${n} · Page ${page+1}/${Math.max(1,Math.ceil(n/4))}</small><button class="btn sm" data-act="marketpage" data-v="${page+1}" ${(page+1)*4>=n?'disabled':''}>Next</button></div>`;
}
function talkStatus(t){
  const p=P(t.pid);if(!p)return"";
  if(t.stage==="club")return`Agreeing a fee with ${esc(team(p.teamId).name)}`;
  if(t.stage==="terms")return t.agreed?"Terms agreed, waiting on you":"Agreeing personal terms";
  return t.stage==="done"?"Signed":"Talks over";
}

function negSheet(){

  const H=human(),it=interest(p),c=t.from?team(t.from):null,live=liveTalk(t),pay=H.roster.reduce((a,id)=>a+P(id).salary,0),sr=scoutRead(p);

  let body="";
  if(t.stage==="club"){
    const guide=Math.round(t.ask*(1+(seeded(t.id)()-.5)*estAmp()/25)/500)*500,first=t.last.fee==null;
    body=`<h3>Transfer fee</h3><p>${first?`Your scout thinks ${esc(c.name)} want around <b>${money(guide)}</b>.`:`${esc(c.name)} are asking <b>${money(t.ask)}</b>.`} ${p.handle} has ${p.years} year${p.years>1?"s":""} left on ${prn(p).p} contract.</p>

    <div class="ngf"><label>Your offer<input class="num" type="number" id="ng-fee" min="0" step="500" value="${t.last.fee!=null?t.last.fee:Math.round(guide*.85/500)*500}"></label><button class="btn primary" data-act="ngclub">Submit offer</button></div>`;
  }else if(t.stage==="terms"){
    const o=t.agreed||{wage:t.last.wage||t.dem.wage,bonus:t.last.bonus!=null?t.last.bonus:t.dem.bonus,years:t.last.years||t.dem.years};
    body=`<h3>Personal terms</h3><p>${p.handle}'s agent wants <b>${money(t.dem.wage)}</b> a week, a <b>${money(t.dem.bonus)}</b> signing bonus and a <b>${t.dem.years} year</b> contract.${t.fee?` Fee agreed: <b>${money(t.fee)}</b>.`:""}</p>

  }else body=`<p class="note">${esc(t.end||talkStatus(t))}</p>`;

}

/* ---------- Build 4.1: player stories ---------- */
function ensureStories(s){
  s.stories=s.stories||{tick:0,events:[],relationships:{},rivalries:{},archive:[]};
  Object.values(s.players||{}).forEach(p=>{
    if(!p.story){const r=seeded(p.id+'|personality');p.story={loyalty:Math.round(30+r()*65),ego:Math.round(20+r()*75),patience:Math.round(25+r()*70),trust:60,confidence:60,expectation:p.age<=20?'Prospect':ovr(p)>=70?'Regular starter':'Rotation',recent:[],roleWeeks:0,unhappyWeeks:0,cool:{},promises:[],transfer:false,club:p.teamId,salary:p.salary};}
  });return s;
}
function storyLog(p,type,text,action){
  const st=S.stories,x=p&&p.story;
  if(x&&(x.cool[type]||0)>st.tick)return;
  if(action&&st.events.some(e=>e.pid===p.id&&e.action===action&&e.status==='open'))return;
  if(x)x.cool[type]=st.tick+6;
  st.events.unshift({id:'story'+S.nextId++,pid:p&&p.id,type,text,action:action||null,status:action?'open':'reported',season:S.season,tick:st.tick});
  if(st.events.length>160)st.events.length=160;if(p&&type==='breakthrough')storyChange(p,3,1);if(p&&type==='confidence')storyChange(p,-2,0);addNews(text,!!(p&&p.teamId==='t0'));
}
function storyChange(p,morale,trust){p.morale=clamp(p.morale+morale,0,100);p.story.trust=clamp(p.story.trust+trust,0,100)}
function storyPromise(p,kind){const x=p.story;if(x.promises.some(q=>q.kind===kind&&q.status==='active'))return false;
  x.promises.push({kind,status:'active',remaining:kind==='time'?6:4,starts:0,salary:p.salary});return true;
}
function storyRespond(id,choice){ensureStories(S);const e=S.stories.events.find(e=>e.id===id&&e.status==='open'),p=e&&P(e.pid);if(!p||p.teamId!=='t0')return;
  if(choice==='promise'&&['time','role','contract'].includes(e.action)){if(!storyPromise(p,e.action))return;storyChange(p,2,0);e.status='promised';addNews(`${p.handle} accepts a promise: ${storyPromiseText(e.action)}.`,true)}
  else if(choice==='support'){storyChange(p,2,1);e.status='discussed'}
  else if(choice==='release'&&e.action==='transfer'){p.listed=true;e.status='listed';addNews(`${p.handle} is available for transfer following talks.`,true)}
  else {storyChange(p,-2,-2);e.status='declined'}save();
}
function storyPromiseText(k){return k==='time'?'three official appearances in the next six eligible team matchdays':k==='role'?'restore the preferred attacking and defending roles within four matchdays':'increase the weekly wage by at least 10% within four matchdays'}
function storyWeek(list){
  ensureStories(S);const st=S.stories;st.tick++;offServerWeek();
  for(const e of st.events)if(e.status==='open'&&(!P(e.pid)||P(e.pid).teamId!=='t0'||st.tick-e.tick>6))e.status='expired';
  const hm=list.find(m=>m.a==='t0'||m.b==='t0');
  for(const id of human().roster){const p=P(id),x=p.story,h=hiddenProfile(p);if(x.club!==p.teamId){x.club=p.teamId;x.recent=[];x.unhappyWeeks=0;x.transfer=false;x.salary=p.salary;x.promises.forEach(q=>{if(q.status==='active')q.status='cancelled'})}
    const played=!!hm&&((hm.lineupUsed||human().starters).includes(id)),eligible=!!hm&&(played||!p.out);
    if(eligible){x.recent.push(played?1:0);if(x.recent.length>8)x.recent.shift()}
    const rate=x.recent.length?x.recent.reduce((a,b)=>a+b,0)/x.recent.length:1,need=x.expectation==='Regular starter'?.7:x.expectation==='Prospect'?.25:.4;
    x.roleWeeks=p.role!==p.prefRole||p.ctRole!==p.prefCt?x.roleWeeks+1:0;
    const underpaid=p.salary<x.salary*1.1&&ovr(p)>teamOvr(human())+5&&p.seas.m>=5;
    const ambition=p.amb>75&&position('t0')>5&&p.seas.m>=5;
    const timeBad=x.recent.length>=5&&rate<need;
    x.unhappyWeeks=timeBad||x.roleWeeks>=4||underpaid||ambition?x.unhappyWeeks+1:Math.max(0,x.unhappyWeeks-1);
    for(const q of x.promises.filter(q=>q.status==='active')){
      if(q.kind==='time'&&!eligible)continue;if(q.kind==='time'&&played)q.starts++;
      q.remaining--;const met=q.kind==='time'?q.starts>=3:q.kind==='role'?p.role===p.prefRole&&p.ctRole===p.prefCt:p.salary>=q.salary*1.1;
      if(met||q.remaining<=0){q.status=met?'kept':'broken';storyChange(p,met?5:-8,met?8:-12);storyLog(p,'promise-'+q.kind,`${p.handle}: ${met?'promise kept':'promise broken'} — ${storyPromiseText(q.kind)}.`)}
    }
    if(eligible&&timeBad&&!played)adjustPlayerConfidence(p,-.5,'Limited official game time');
    if(timeBad)storyLog(p,'time',`${p.handle} wants more game time after ${x.recent.reduce((a,b)=>a+b,0)} appearances in ${x.recent.length} eligible matchdays.`,'time');
    else if(x.roleWeeks>=4)storyLog(p,'role',`${p.handle} is unhappy playing away from the preferred ${p.prefRole} / ${p.prefCt} roles.`,'role');
    else if(underpaid)storyLog(p,'contract',`${p.handle} believes recent performances and standing in the squad deserve improved terms.`,'contract');
    else if(ambition)storyLog(p,'ambition',`${p.handle} is frustrated by the promotion challenge and wants to compete at a higher level.`,'support');
    if(x.unhappyWeeks>=Math.round(5+x.patience/20+x.loyalty/30)&&!x.transfer){x.transfer=true;storyLog(p,'transfer',`${p.handle} requests a transfer after sustained dissatisfaction.`,'transfer');storyChange(p,-4,-5)}
    if(x.transfer&&x.unhappyWeeks===0&&x.trust>=55){x.transfer=false;storyLog(p,'commit',`${p.handle} withdraws the transfer request after circumstances improve.`)}
    if(played){const won=hm.res.winner==='t0',rating=p.seas.m?p.seas.rs/p.seas.m:1;
      if(p.age<=22&&p.seas.m>=3&&rating>=1.15&&p.form>0)storyLog(p,'breakthrough',`${p.handle} is gaining confidence after a breakthrough run of performances.`);
      if(x.confidence<40)storyLog(p,'confidence',`${p.handle} is struggling for confidence after recent defeats.`,'support');
      if(p.form>=3)storyLog(p,'form',`${p.handle} is enjoying excellent form and credits the team environment.`);
    }
    if(S.practiceCount>=3&&p.fat>=60&&h.work<60)storyLog(p,'load',`${p.handle} complains about excessive PCWs while fatigued.`,'support');
    if(p.age>=32&&p.seas.m>=3&&rate<.4)storyLog(p,'veteran',`${p.handle} is considering the future after a season of limited involvement.`);
    x.promises=x.promises.slice(-12);
  }
  const ids=human().roster;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const a=P(ids[i]),b=P(ids[j]),key=pairKey(a.id,b.id),r=st.relationships[key]||(st.relationships[key]={value:0,days:0}),both=hm&&(hm.lineupUsed||human().starters).includes(a.id)&&(hm.lineupUsed||human().starters).includes(b.id);
    if(!both)continue;r.days++;const conflict=a.prefRole===b.prefRole&&a.story.ego+b.story.ego>130&&a.story.unhappyWeeks+b.story.unhappyWeeks>3;
    const before=r.value;r.value=clamp(r.value+(conflict?-3:hm.res.winner==='t0'?2:(a.chemistryNationality||a.nat)===(b.chemistryNationality||b.nat)?1:-1),-30,40);
    if(before<20&&r.value>=20){storyLog(a,'friend-'+b.id,`${a.handle} and ${b.handle} have become close teammates through shared match experience.`);S.chem[key]=clamp((S.chem[key]||0)+2,0,100)}
    if(before>-15&&r.value<=-15){storyLog(a,'clash-'+b.id,`${a.handle} and ${b.handle} clash over competing roles and recent frustrations.`,'support');S.chem[key]=clamp((S.chem[key]||0)-2,0,100)}
  }
  for(const m of list){const k=[m.a,m.b].sort().join('|'),r=st.rivalries[k]||(st.rivalries[k]={a:m.a,b:m.b,meetings:0,heat:0});r.meetings++;
    const close=(m.res.maps||[]).some(mm=>Math.abs(mm.score[0]-mm.score[1])<=3),big=m.comp==='P'||m.comp==='C'&&SCHED[S.step].r===CUPR.length-1,before=r.heat;
    r.heat=clamp(r.heat+(close?2:0)+(big?3:0),0,20);
    if(before<6&&r.heat>=6)addNews(`${team(m.a).name} and ${team(m.b).name} develop a rivalry after ${r.meetings} competitive meetings.`,m.a==='t0'||m.b==='t0');
  }
}
function playerStoryHtml(p){const x=p.story;if(!x)return'';const peers=human().roster.filter(id=>id!==p.id).map(id=>{const r=S.stories.relationships[pairKey(p.id,id)],v=r?r.value:0;return `${esc(P(id).handle)}: ${v>=20?'Close':v>=8?'Good':v<=-15?'Poor':'Neutral'}`});
  return `<details class="panel" style="margin-top:10px"><summary><b>Player story · ${esc(p.handle)}</b> · ${x.transfer?'Transfer requested':x.unhappyWeeks>=3?'Unsettled':'Settled'}</summary><p>${x.expectation} · Confidence: ${Math.round(p.confidence)} · Trust: ${x.trust>=70?'Strong':x.trust<40?'Strained':'Developing'}</p><p>Role: ${x.roleWeeks>=4?'Unhappy':x.roleWeeks?'Adjusting':'Satisfied'}. ${x.recent.length?`${x.recent.reduce((a,b)=>a+b,0)} appearances in ${x.recent.length} eligible official matchdays.`:'Game-time evidence is building.'}</p><p class="hint">${peers.join(' · ')}</p>${x.promises.filter(q=>q.status==='active').map(q=>`<p>Promise: ${storyPromiseText(q.kind)} · ${q.remaining} matchdays left${q.kind==='time'?` · ${q.starts}/3 appearances`:''}</p>`).join('')}</details>`;
}
function storyInboxHtml(){ensureStories(S);const es=S.stories.events.filter(e=>e.status==='open'&&P(e.pid)&&P(e.pid).teamId==='t0');return `<h3>Player conversations${es.length?' ('+es.length+')':''}</h3>${es.length?es.map(e=>`<div class="panel" style="margin-bottom:8px"><p>${esc(e.text)}</p><div class="row">${['time','role','contract'].includes(e.action)?`<button class="btn sm" data-act="storyreply" data-id="${e.id}" data-choice="promise">Promise: ${storyPromiseText(e.action)}</button>`:''}${e.action==='transfer'?`<button class="btn sm" data-act="storyreply" data-id="${e.id}" data-choice="release">Allow transfer · list player</button>`:''}<button class="btn sm" data-act="storyreply" data-id="${e.id}" data-choice="support">Offer support</button><button class="btn sm" data-act="storyreply" data-id="${e.id}" data-choice="decline">Decline request</button></div></div>`).join(''):'<p class="hint">No outstanding player conversations.</p>'}`}

/* ---------- Build 4.2: strategic identity ---------- */
const TACTIC_FIELDS={
 tempo:{label:'Execute timing',values:['Standard','Early','Late']},site:{label:'Site preference',values:['Balanced','A','B']},route:{label:'Approach route',values:['Balanced','Main lane','Alternate lane','Avoid early mid']},utility:{label:'Utility package',values:['Balanced','Heavy execute','Contact']},lurk:{label:'Lurk emphasis',values:['Balanced','Low','High']},
 defence:{label:'Defensive setup',values:['Balanced','Lean A','Lean B','Retake']},mid:{label:'Mid control',values:['Balanced','Contest','Passive']},rotation:{label:'Rotations',values:['Balanced','Fast','Patient']},anchors:{label:'Anchor commitment',values:['Hold','Flexible']}
};
function tacticDefaults(){return{tempo:'Standard',site:'Balanced',route:'Balanced',utility:'Balanced',lurk:'Balanced',defence:'Balanced',mid:'Balanced',rotation:'Balanced',anchors:'Hold'}}
function ensureTactics(s){s.tactics=s.tactics||{base:tacticDefaults(),maps:{},plans:{},counter:null,record:{},calls:[]};s.tactics.base={...tacticDefaults(),...s.tactics.base};return s}
function matchTactics(M,i){const t=team(i?M.b:M.a);if(!t.human)return tacticDefaults();const cfg={...M.identity};const counter=M.counter;if(counter&&counter.opponent===(i?M.a:M.b)){if(counter.defence)cfg.defence=counter.defence;if(counter.mid)cfg.route=counter.mid}return cfg}
function planTactics(M,i,plan){return managementOrderConfig(M,i,{...matchTactics(M,i),...(team(i?M.b:M.a).human?((M.planSettings||{})[plan]||{}):{})})}
function tacticalScope(){ensureTactics(S);return ui.tacticMap&&S.mapPool.includes(ui.tacticMap)?ui.tacticMap:'team'}
function tacticalEdit(field,value,plan){if(ui.live){ui.msg='Change the playbook between matches.';return}ensureTactics(S);if(!TACTIC_FIELDS[field]||(!TACTIC_FIELDS[field].values.includes(value)&&!(plan&&value==='inherit')))return;
  if(plan){if(!TPLANS.concat(CTPLANS).includes(plan))return;const q=S.tactics.plans[plan]||(S.tactics.plans[plan]={});if(value==='inherit')delete q[field];else q[field]=value}

function mapCommandLocations(map){const B=BASES[map]||S?.customMaps?.[map]||FUTURE_MAPS[map];if(!B?.nodes)return[];return Object.entries(B.nodes).filter(([id,n])=>typeof n[4]==='string'&&n[4].trim()).map(([id,n])=>{const name=n[4].trim(),key=normaliseCallout(name);return{id,name,label:id==='A'||id==='B'?'Site '+id:name,x:n[0],y:n[1],w:n[2],h:n[3],aliases:[...new Set([key,...(COMMAND_CALLOUT_ALIASES[key]||[])].map(normaliseCallout))]}})}

function autoFillLineup(code,healthOnly=false){if(!S||ui.live)return [];const H=human(),L=ensureHumanLineups(),ids=L[code].slice(),changes=[];const healthKey=H.roster.map(id=>{const p=P(id);return id+':'+p?.out+':'+p?.refusing+':'+p?.medCase?.kind+':'+p?.medCase?.assessed}).join('|');if(ui.autoAvailability?.career!==S)ui.autoAvailability={career:S};if(healthOnly&&ui.autoAvailability[code]===healthKey)return [];ui.autoAvailability[code]=healthKey;const choose=old=>H.roster.map(P).filter(autoPlayerAvailable).filter(p=>!ids.includes(p.id)).sort((a,b)=>{const fit=p=>(old&&p.role===old.role?1000:0)+(!ids.map(P).some(p=>p?.role==='IGL')&&p.role==='IGL'?400:0)+ovr(p)-(p.fat||0)*.15;return fit(b)-fit(a)||a.id.localeCompare(b.id)})[0];for(let i=0;i<ids.length;i++){const old=P(ids[i]);if(autoPlayerAvailable(old))continue;const next=choose(old);if(next){ids[i]=next.id;changes.push({out:old?.handle||'Unavailable player',in:next.handle,reason:old?.refusing?'refusing to play':old?.outReason||'illness / recovery'})}}while(ids.length<5){const next=choose(null);if(!next)break;ids.push(next.id);changes.push({out:'Empty slot',in:next.handle,reason:'lineup vacancy'})}if(changes.length){L[code]=ids;if(code==='A')H.starters=ids.slice();S.autoLineupLog=S.autoLineupLog||[];for(const c of changes){S.autoLineupLog.unshift({season:S.season,step:S.step,code,...c});addNews(`Lineup ${code}: automatically assigned ${c.in} for ${c.out} (${c.reason}). Review in Team.`,true)}S.autoLineupLog.length=Math.min(20,S.autoLineupLog.length);save()}return changes}
function autoLineupNotice(code){const entries=(S.autoLineupLog||[]).filter(x=>x.code===code&&x.season===S.season&&x.step===S.step);return entries.length?`<div class="note auto-lineup-notice" role="status"><b>Lineup ${code} automatically updated</b><span>${entries.map(x=>esc(x.in)+' for '+esc(x.out)+' · '+esc(x.reason)).join('; ')}.</span><button class="btn sm" data-act="tab" data-tab="squad">Review team</button></div>`:''}
const rosterPrepBase=preMatchView;preMatchView=function(m){autoFillLineup(lineupCode(m));const ready=humanLineup(lineupCode(m)).every(id=>autoPlayerAvailable(P(id)))&&humanLineup(lineupCode(m)).length===5;let html=rosterPrepBase(m);if(!ready)html=html.replace('data-act="play"','data-act="play" disabled');return autoLineupNotice(lineupCode(m))+(!ready?'<p class="note bad">Five fit players are required. No available substitute could complete the lineup; review Team or Medical centre.</p>':'')+html};
const rosterPcwBase=pcwView;pcwView=function(){if(!ui.live)autoFillLineup('B');return (ui.live?'':autoLineupNotice('B'))+rosterPcwBase()};
const rosterStartBase=startSeries;startSeries=function(){const m=humanMatch();if(!m||ui.live)return;autoFillLineup(lineupCode(m));if(humanLineup(lineupCode(m)).filter(id=>autoPlayerAvailable(P(id))).length!==5){ui.msg='Not enough fit players to field five. Review Team or Medical centre.';render();return}rosterStartBase()};
const rosterPracticeBase=startPractice;startPractice=function(){if(!ui.live)autoFillLineup('B');rosterPracticeBase()};
const rosterOpenBreakBase=openBreak;openBreak=function(mode){rosterOpenBreakBase(mode);const L=ui.live,ht=L.ht;if(ht.sick&&mode==='half'){const old=P(ht.sick),bench=human().roster.map(P).filter(autoPlayerAvailable).filter(p=>!L.M.lineup[0].includes(p.id)).sort((a,b)=>(b.role===old?.role)-(a.role===old?.role)||ovr(b)-ovr(a));ht.out=bench.length?ht.sick:'';ht.in=bench[0]?.id||'';ht.autoSub=bench.length?`${bench[0].handle} is selected to replace unwell ${old.handle} when you continue. Review Team & subs to change it.`:'No fit substitute is available for '+old.handle+'.'}};
const rosterLiveBase=liveView;liveView=function(){let html=rosterLiveBase();const note=ui.live?.ht?.autoSub;if(note&&['half','timeout'].includes(ui.live.v.phase))html=html.replace('<div class="match-resume">','<div class="match-resume"><span class="auto-sub-note" role="status">'+esc(note)+'</span>');return html};
squadView=function(){const code=ui.lineupTab||'A';autoFillLineup(code,true);const H=human(),ids=humanLineup(code),part=ui.squadPart||'attributes',players=H.roster.map(P).filter(Boolean),page=polishPage('compact-squad',players.length,6),ps=players.slice(page*6,page*6+6),tabs=[['attributes','Attributes'],['contracts','Contracts'],['condition','Condition'],['maps','Maps & specialities']];const start=p=>`<td><input type="checkbox" data-act="starter" data-id="${p.id}" data-lineup="${code}" aria-label="Start ${esc(p.handle)} in Lineup ${code}" ${ids.includes(p.id)?'checked':''} ${!ids.includes(p.id)&&(ids.length>=5||!autoPlayerAvailable(p))?'disabled':''}></td>`,who=p=>`<td class="l"><button class="plink" data-act="profile" data-id="${p.id}"><b>${esc(p.handle)}</b></button></td>`;let table='';if(part==='attributes')table=`<th>Role</th><th>Age</th>${STATK.map(k=>`<th>${SKN[k]}</th>`).join('')}<th>Potential</th>`;else if(part==='contracts')table='<th>Wage / week</th><th>Contract</th><th>Value</th><th>Status</th><th>Action</th>';else if(part==='condition')table='<th>Form</th><th>Condition</th><th>Fatigue</th><th>Durability</th><th>Morale</th>';else table='<th>Best position</th><th>Specialities</th><th>Best map</th>';
return `<div class="compact-squad"><div class="page-heading"><h2>Team · Lineup ${code}</h2><small>${ids.filter(id=>autoPlayerAvailable(P(id))).length}/5 fit · Payroll ${money(players.reduce((a,p)=>a+p.salary,0))}/week</small></div><div class="row">${[['A','League'],['B','PCW'],['C','Cup']].map(([k,l])=>`<button class="btn sm" data-act="lineuptab" data-v="${k}" aria-pressed="${code===k}">${k} · ${l}</button>`).join('')}</div>${autoLineupNotice(code)}<div class="row compact-squad-tabs">${tabs.map(([k,l])=>`<button class="btn sm" data-squad-part="${k}" aria-pressed="${part===k}">${l}</button>`).join('')}</div><div class="tbl"><table class="compact-squad-table"><thead><tr><th>Start</th><th class="l">Player</th>${table}</tr></thead><tbody>${ps.map(p=>`<tr class="${ids.includes(p.id)?'me':''}">${start(p)}${who(p)}${part==='attributes'?`<td>${p.role}</td><td>${p.age}</td>${STATK.map(k=>`<td><b>${estTxt(p,k)}</b></td>`).join('')}<td>${potLabel(p)}</td>`:part==='contracts'?`<td>${money(p.salary)}</td><td>${p.years} yr</td><td>${money(p.value)}</td><td>${p.listed?'Listed':'Squad'}</td><td><button class="btn sm" data-act="release" data-id="${p.id}" ${H.roster.length<=5?'disabled':''}>Release</button></td>`:part==='condition'?`<td>${formLbl(p.form)}</td><td>${conditionHtml(p)}${p.out?' · '+p.out+' weeks':''}${p.refusing?' · Refusing':''}</td><td>${Math.round(p.fat||0)}</td><td>${abilityStars(p.durability)}</td><td>${moraleTxt(p.morale)}</td>`:`<td>${p.bestPosition==='M'?'Mid':p.bestPosition}</td><td>${traitPills(p)}</td><td>${esc(Object.entries(p.maff||{}).filter(([m])=>MAPS.includes(m)).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Unassessed')}</td>`}</tr>`).join('')}</tbody></table></div>${polishPager('compact-squad',page,players.length,6)}<small class="hint">Inspect a player for full details. Starting selections affect Lineup ${code} only.</small></div>`};
const rosterProfileBase=profileSheet;profileSheet=function(){const html=rosterProfileBase(),p=P(ui.prof);if(!html||!p)return html;const el=document.createElement('div');if(!el.querySelector)return html;el.innerHTML=html;const card=el.querySelector('.player-profile'),cols=card?.querySelector('.two');if(!card||!cols)return html;const left=cols.children[0],right=cols.children[1],main=left.querySelector('table'),xp=card.querySelector('.profile-xp'),head=card.querySelector('.phead'),identity=head.querySelector('.profile-identity'),lead=left.querySelector('.sks'),part=(ui.profileParts||{})[p.id]||'attributes';identity?.remove();const details=[...left.children].filter(x=>x!==main&&x!==lead),extra=[...card.children].filter(x=>x!==head&&x!==cols&&x!==xp),service=extra.filter(x=>x.querySelector('[data-act="openspecialitytraining"]'));const tabs=[['attributes','Attributes'],['details','Contract & identity'],['leadership','Leadership'],['background','Career & reports']];let body='';if(part==='attributes')body=`<div class="compact-profile-grid"><div class="tbl">${main.outerHTML}</div><div>${xp?.outerHTML||''}<p class="hint">Best defensive position: <b>${p.bestPosition==='M'?'Mid':p.bestPosition}</b><br>${p.role} · ${p.ctRole}<br>${p.out?'Unavailable: '+esc(p.outReason||'Recovery'):autoPlayerAvailable(p)?'Available':'Medical assessment needed'}</p>${extra.filter(x=>x.tagName==='SMALL').map(x=>x.outerHTML).join('')}</div></div>`;else if(part==='details'){ui.profileDetailsPages=ui.profileDetailsPages||{};const rows=[...right.querySelectorAll('tbody tr')],page=clamp(ui.profileDetailsPages[p.id]||0,0,Math.max(0,Math.ceil(rows.length/8)-1));ui.profileDetailsPages[p.id]=page;const clone=right.cloneNode(true);[...clone.querySelectorAll('tbody tr')].forEach((r,i)=>{if(i<page*8||i>=page*8+8)r.remove()});body=`${clone.outerHTML}${rows.length>8?`<div class="row profile-detail-pager"><button class="btn sm" data-profile-detail-page="${page-1}" data-id="${p.id}" ${page?'':'disabled'}>Previous details</button><small>${page+1}/${Math.ceil(rows.length/8)}</small><button class="btn sm" data-profile-detail-page="${page+1}" data-id="${p.id}" ${(page+1)*8>=rows.length?'disabled':''}>Next details</button></div>`:''}${identity?.outerHTML||''}${service.map(x=>x.outerHTML).join('')}`;}else if(part==='leadership')body=(lead?.outerHTML||'')+(xp?.outerHTML||'');else body=details.map(x=>x.outerHTML).join('')+extra.filter(x=>!service.includes(x)).map(x=>x.outerHTML).join('');card.innerHTML=head.outerHTML+`<div class="row compact-profile-tabs">${tabs.map(([k,l])=>`<button class="btn sm" data-profile-part="${k}" data-id="${p.id}" aria-pressed="${part===k}">${l}</button>`).join('')}</div><div class="compact-profile-body">${body}</div>`;card.classList.add('compact-player-profile');return el.innerHTML};
const rosterTutorialBase=tutorialPromptHtml;tutorialPromptHtml=function(){const html=rosterTutorialBase();return ui.tab==='squad'&&html?`<details class="compact-team-tutorial"><summary>Career tutorial · open current tasks</summary>${html}</details>`:html};
document.addEventListener('click',e=>{const el=e.target.closest?.('[data-squad-part],[data-profile-part]');if(!el||!S)return;e.preventDefault();e.stopImmediatePropagation();if(el.dataset.squadPart)ui.squadPart=el.dataset.squadPart;else{ui.profileParts=ui.profileParts||{};ui.profileParts[el.dataset.id]=el.dataset.profilePart}render()},true);

const rosterValidateBase=validateCareer;validateCareer=function(s){const result=rosterValidateBase(s);if(s.autoLineupLog!=null&&(!Array.isArray(s.autoLineupLog)||s.autoLineupLog.length>20||s.autoLineupLog.some(x=>!x||!Number.isInteger(x.season)||x.season<1||!Number.isInteger(x.step)||x.step<0||!['A','B','C'].includes(x.code)||!['in','out','reason'].every(k=>typeof x[k]==='string'))))throw Error('Invalid career: automatic lineup log');return result};
document.addEventListener('click',e=>{const el=e.target.closest?.('[data-profile-detail-page]');if(!el||el.disabled)return;e.preventDefault();e.stopImmediatePropagation();ui.profileDetailsPages=ui.profileDetailsPages||{};ui.profileDetailsPages[el.dataset.id]=Number(el.dataset.profileDetailPage);render()},true);

S=load();
if(S){setCompetition(S);MAPS=S.mapPool;ensurePotentialIntel(S);ensureTalents(S);}
if(S&&S.econDefault)ui.econ=S.econDefault;
if(S){Object.values(S.players).forEach(p=>used.add(p.handle));ensureBuild3();ensureWeaponSystem()}
render();
